name: CI

# Y-Dude nutzt GitHub ausschliesslich als Backup/Versionssicherung.
# Diese Prüfung ist NICHT Teil des Betriebs und wird deshalb nicht mehr
# automatisch bei Push oder Pull Request ausgeführt (keine Fehler-Mails bei
# jedem Lovable-Update). Sie kann bei Bedarf manuell gestartet werden:
# GitHub → Actions → "CI" → "Run workflow".
#
# Das verbindliche Freigabe-Gate vor einer Veröffentlichung bleibt lokal:
#   bun run verify
#
# Hinweis: Im CI fehlen bewusst nicht versionierte Artefakte
# (u. a. die generierte Datei src/routeTree.gen.ts und die Umgebungswerte),
# weshalb die Typprüfung dort nicht ohne Vorbereitung durchläuft.

on:
  workflow_dispatch:

jobs:
  verify:
    name: Typprüfung, Lint und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Routen-Typen generieren
        run: bunx tsr generate || true

      - name: Freigabe-Gate
        run: bash scripts/verify.sh
